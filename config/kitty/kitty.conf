# Archther Dark — Kitty terminal theme
#
# Palette reference: config/hypr/themes/archther.lua (canonical tokens) and
# context/ui-tokens.md. Values below reuse canonical Archther colors; the
# ANSI palette and tab colors are documented supporting colors, not brand
# tokens. Appearance only — no font, shell, shortcut, or behavior settings
# live here, so existing Kitty behavior is preserved.

# --- Core ---
background #0B0F14
foreground #F8FAFC

# --- Selection (navy highlight, readable light text) ---
selection_background #163B85
selection_foreground #F8FAFC

# --- Cursor (gold block, navy text underneath) ---
cursor #E8A11C
cursor_text_color #0B0F14

# --- URLs (cyan accent) ---
url_color #38BDF8
url_style curly

# --- Window borders (match Hyprland Archther borders) ---
active_border_color #E8A11C
inactive_border_color #071A46

# --- Tabs ---
active_tab_background #E8A11C
active_tab_foreground #0B0F14
inactive_tab_background #172033
inactive_tab_foreground #CBD5E1
tab_bar_background #0B0F14

# --- ANSI palette (supporting colors anchored on Archther tokens) ---
# black/gray
color0 #111827
color8 #334155
# red
color1 #F87171
color9 #F87171
# green
color2 #22C55E
color10 #22C55E
# yellow/gold
color3 #E8A11C
color11 #F6BD49
# blue (navy family + cyan bright for readability)
color4 #163B85
color12 #38BDF8
# magenta/violet (supporting; no brand equivalent)
color5 #A78BFA
color13 #C4B5FD
# cyan
color6 #38BDF8
color14 #38BDF8
# white
color7 #CBD5E1
color15 #F8FAFC
